[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
uuid = { version = "1", features = ["v4"] }
