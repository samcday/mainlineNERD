name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synapse-smoke:
    name: real Synapse smoke test
    runs-on: ubuntu-latest
    # Hard ceiling: the whole job, including image pull and build, is bounded.
    timeout-minutes: 30
    env:
      # The xtask owns the pinned Synapse image used locally and in CI.
      SMOKE_READY_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
        with:
          # Later steps run repository-controlled build/test code; it has no use
          # for the checkout credential.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --workspace

      - name: Real Synapse smoke test
        # The real binary, its SQLite receipt, and Synapse's access log.
        run: timeout 22m cargo xtask smoke
