name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synapse-smoke:
    name: real Synapse smoke test
    runs-on: ubuntu-latest
    # Hard ceiling: the whole job, including image pull and build, is bounded.
    timeout-minutes: 30
    env:
      # Pinned official Synapse image and toolchain; scripts/local-smoke.sh
      # defaults to the same image version and rust-toolchain.toml pins the same
      # Rust version for local runs.
      SYNAPSE_IMAGE: ghcr.io/element-hq/synapse:v1.162.0
      SMOKE_READY_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Real Synapse smoke test
        # scripts/local-smoke.sh checks the happy path (receipt, SQLite row,
        # one successful initial /sync in Synapse's access log) and that bad
        # credentials/identity write no record.
        run: timeout 22m bash scripts/local-smoke.sh
